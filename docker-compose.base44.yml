services:
  web:
    image: node:22-bookworm-slim
    working_dir: /app
    restart: on-failure
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    environment:
      - NODE_ENV=development
      # Consumed by Vite (>= 6.1) so the proxied preview hostname is accepted.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 6s
      retries: 12
      start_period: 90s

volumes:
  web_node_modules:
